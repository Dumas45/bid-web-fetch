<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Fetch</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input[type="url"] { flex: 1; padding: 8px 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 18px; font-size: 1rem; cursor: pointer; border: none; background: #0066cc; color: #fff; border-radius: 4px; }
    button:hover { background: #0052a3; }
    .error { color: #cc0000; margin-top: 16px; }
    pre { margin-top: 24px; white-space: pre-wrap; word-break: break-word; background: #f5f5f5; padding: 16px; border-radius: 4px; font-size: 0.9rem; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Web Fetch</h1>
  <form method="post">
    <input type="url" name="url" placeholder="https://example.com" value="{{ url }}" required autofocus>
    <button type="submit">Send</button>
  </form>
  {% if error %}
    <p class="error">Error: {{ error }}</p>
  {% endif %}
  {% if content is not none %}
    <pre>{{ content }}</pre>
  {% endif %}
</body>
</html>
