[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bid-web-fetch"
version = "0.2.3"
description = "A Flask web app that fetches web pages as plain text via an MCP client"
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
authors = [
    { name = "dumas45", email = "n77ray@gmail.com" },
]
keywords = ["flask", "mcp", "web", "fetch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: Flask",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "flask==3.1.3",
    "mcp==1.27.1",
    "spacy==3.8.14",
]

[project.optional-dependencies]
nlp = ["en-core-web-sm"]

[project.urls]
Homepage = "https://github.com/dumas45/bid-web-fetch"
Repository = "https://github.com/dumas45/bid-web-fetch"

[project.scripts]
bid-fetch = "bid_fetch_mcp.main:run"

[tool.hatch.build.targets.wheel]
packages = ["bid_fetch_mcp"]

[tool.hatch.build.targets.wheel.shared-data]

[tool.hatch.build.targets.sdist]
include = [
    "bid_fetch_mcp/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "requirements.txt",
]

[tool.hatch.build.targets.wheel.force-include]
"bid_fetch_mcp/package.json" = "bid_fetch_mcp/package.json"
"bid_fetch_mcp/templates/index.html" = "bid_fetch_mcp/templates/index.html"
"requirements.txt" = "bid_fetch_mcp/requirements.txt"

[tool.uv.sources]
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
